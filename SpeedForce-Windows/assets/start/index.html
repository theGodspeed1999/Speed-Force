<!doctype html>
<html><head><meta charset="utf-8"><title>New tab</title><meta name="color-scheme" content="light dark">
<style>
:root{--bg:#fff;--card:#f3f4f8;--tx:#1b1c22;--dim:#5d5f6e;--ac:#fb542b}
@media(prefers-color-scheme:dark){:root{--bg:#1b1c22;--card:#2b2d37;--tx:#ededf1;--dim:#a8aab8;--ac:#ff7654}}
body{margin:0;min-height:100vh;box-sizing:border-box;background:radial-gradient(1200px 500px at 50% -10%,rgba(251,84,43,.13),transparent 60%),var(--bg);color:var(--tx);font:15px "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4vh 20px}
img.logo{width:120px;height:120px;border-radius:50%;box-shadow:0 8px 40px rgba(251,84,43,.28)}h1{margin:16px 0 0;font-size:36px;letter-spacing:.5px}p.m{color:var(--dim);margin:4px 0 6px;font-size:16px}p.pr{color:var(--dim);margin:0 0 26px;font-size:12px;letter-spacing:.4px}
form{width:min(620px,100%)}input{width:100%;box-sizing:border-box;height:48px;border-radius:24px;border:0;background:var(--card);color:var(--tx);padding:0 22px;font:inherit;outline:2px solid transparent}input:focus{outline-color:var(--ac)}
.stats{display:flex;gap:12px;margin:26px 0;flex-wrap:wrap;justify-content:center}.stats div{background:var(--card);border-radius:16px;padding:14px 22px;min-width:150px}.stats b{display:block;font-size:26px}.stats span{color:var(--dim);font-size:12px}
.sites{display:grid;grid-template-columns:repeat(4,92px);gap:14px}.sites a{text-decoration:none;color:var(--tx);text-align:center;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sites i{display:flex;width:54px;height:54px;border-radius:50%;margin:0 auto 6px;align-items:center;justify-content:center;color:#fff;font:700 22px sans-serif;font-style:normal}
</style></head><body>
<img class="logo" src="logo.png" alt=""><h1>Speed Force</h1><p class="m">Fast. Private. Ad-free.</p><p class="pr">NO NEWS &middot; NO ADS &middot; NO TRACKING &middot; ALL ON THIS PC</p>
<form id="f"><input id="q" autofocus placeholder="Search or type a web address"></form>
<div class="stats"><div><b id="s1" style="color:var(--ac)">0</b><span>Trackers &amp; ads blocked</span></div><div><b id="s2" style="color:#7b83ff">0 KB</b><span>Data saved (est.)</span></div><div><b id="s3" style="color:#3dba6b">0 s</b><span>Time saved (est.)</span></div></div>
<div class="sites" id="sites"></div>
<script src="start.js"></script>
</body></html>
